[workspace]
name = "openusd"
platforms = ["linux-64"]
channels = ["https://conda.anaconda.org/anderslanglands", "conda-forge"]
channel-priority = "strict"

[dependencies]
python = "3.11.*"
openimageio = "2.5.*"
opensubdiv-gpu = "*"
tbb = "*"
pyside6 = "*"
pyopengl = "==3.1.10"
jinja2 = "*"
embree = "4.4.*"
openqmc = "==0.7.1"
numpy = "*"

# Build deps
cmake = "*"
ninja = "*"
c-compiler = "*"
cxx-compiler = "*"

[target.linux-64.tasks]
configure = { cmd = [
    "bash",
    "-lc",
'''set -e
export CXXFLAGS="${CXXFLAGS} -fno-visibility-inlines-hidden"
export DEBUG_CXXFLAGS="${DEBUG_CXXFLAGS} -fno-visibility-inlines-hidden"
cmake -B build -G Ninja \
-DPXR_PY_UNDEFINED_DYNAMIC_LOOKUP=OFF \
-DPXR_OIIO_PLUGIN_ENABLED=TRUE \
-DPXR_BUILD_EMBREE_PLUGIN=TRUE \
-DPXR_BUILD_OPENIMAGEIO_PLUGIN=TRUE \
-DPXR_ENABLE_OPENQMC_SUPPORT=TRUE \
-DPXR_HDEMBREE_ENABLE_OPENQMC=2 \
-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX'''
] }

build = { cmd = '''
set -e
cmake --build build --target install
python -c "import os, pathlib, sysconfig; p = pathlib.Path(sysconfig.get_path('purelib'), 'openusd-pxr.pth'); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(os.path.join(os.environ['CONDA_PREFIX'], 'lib', 'python') + '\n')"
''', depends-on = ["configure"] }

usdview = { cmd = "usdview --complexity high --renderer Embree", depends-on = ["build"] }
