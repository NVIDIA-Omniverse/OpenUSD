[workspace]
name = "openusd"
platforms = ["linux-64", "win-64"]
channels = ["https://conda.anaconda.org/anderslanglands", "conda-forge"]
channel-priority = "strict"

[dependencies]
python = "3.11.*"
openimageio = "2.5.*"
openimageio-format-gif = "2.5.*"
openimageio-format-webp = "2.5.*"
opensubdiv-gpu = "*"
tbb = "*"
pyside6 = "*"
pyopengl = "==3.1.10"
jinja2 = "*"
embree = "4.4.*"
openqmc = "==0.7.1"
materialx-render = "==1.39.4"
numpy = "*"

# Build deps
cmake = "*"
ninja = "*"
c-compiler = "*"
cxx-compiler = "*"

[target.linux-64.tasks]
configure = { cmd = [
    "bash",
    "-lc",
'''set -e
export CXXFLAGS="${CXXFLAGS} -fno-visibility-inlines-hidden"
export DEBUG_CXXFLAGS="${DEBUG_CXXFLAGS} -fno-visibility-inlines-hidden"
cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
-DPXR_PY_UNDEFINED_DYNAMIC_LOOKUP=OFF \
-DPXR_OIIO_PLUGIN_ENABLED=TRUE \
-DPXR_BUILD_EMBREE_PLUGIN=TRUE \
-DPXR_BUILD_OPENIMAGEIO_PLUGIN=TRUE \
-DPXR_ENABLE_OPENQMC_SUPPORT=TRUE \
-DPXR_ENABLE_MATERIALX_SUPPORT=TRUE \
-DPXR_HDEMBREE_ENABLE_OPENQMC=2 \
-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX'''
] }

configure-profile = { cmd = [
    "bash",
    "-lc",
'''set -e
export CXXFLAGS="${CXXFLAGS} -fno-visibility-inlines-hidden"
export DEBUG_CXXFLAGS="${DEBUG_CXXFLAGS} -fno-visibility-inlines-hidden"
cmake -B build-profile -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
-DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O3 -g -DNDEBUG -fno-omit-frame-pointer" \
-DPXR_PY_UNDEFINED_DYNAMIC_LOOKUP=OFF \
-DPXR_OIIO_PLUGIN_ENABLED=TRUE \
-DPXR_BUILD_EMBREE_PLUGIN=TRUE \
-DPXR_BUILD_OPENIMAGEIO_PLUGIN=TRUE \
-DPXR_ENABLE_OPENQMC_SUPPORT=TRUE \
-DPXR_ENABLE_MATERIALX_SUPPORT=TRUE \
-DPXR_HDEMBREE_ENABLE_OPENQMC=2 \
-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX'''
] }

build = { cmd = '''
set -e
cmake --build build --target install
python -c "import os, pathlib, sysconfig; p = pathlib.Path(sysconfig.get_path('purelib'), 'openusd-pxr.pth'); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(os.path.join(os.environ['CONDA_PREFIX'], 'lib', 'python') + '\n')"
''', depends-on = ["configure"] }

build-profile = { cmd = "cmake --build build-profile --target pxr/imaging/plugin/hdEmbree/install", depends-on = ["configure-profile"] }

usdview = { cmd = "usdview --complexity high --renderer Embree" }
usdrecord = { cmd = "usdrecord --complexity high --renderer Embree" }
usdrender = { cmd = "usdrender --complexity high --renderer Embree" }

[target.win-64.dependencies]
tbb-devel = "*"

[target.win-64.tasks]
configure = { cmd = '''"$CONDA_PREFIX/Library/bin/cmake.exe" -B build -G Ninja -DPXR_PY_UNDEFINED_DYNAMIC_LOOKUP=OFF -DPXR_OIIO_PLUGIN_ENABLED=TRUE -DPXR_BUILD_EMBREE_PLUGIN=TRUE -DPXR_BUILD_OPENIMAGEIO_PLUGIN=TRUE -DPXR_ENABLE_OPENQMC_SUPPORT=TRUE -DPXR_ENABLE_MATERIALX_SUPPORT=TRUE -DPXR_HDEMBREE_ENABLE_OPENQMC=2 -DPXR_ENABLE_PRECOMPILED_HEADERS=OFF -DCMAKE_SUPPRESS_REGENERATION=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="/utf-8" -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX"''' }

build = { cmd = '''"$CONDA_PREFIX/Library/bin/cmake.exe" --build build --target install && "$CONDA_PREFIX/python.exe" -c "import os, pathlib, sysconfig; prefix = os.environ['CONDA_PREFIX']; p = pathlib.Path(sysconfig.get_path('purelib'), 'openusd-pxr.pth'); p.parent.mkdir(parents=True, exist_ok=True); dll_line = 'import os; os._openusd_dll_dirs=[os.add_dll_directory(os.path.join(os.environ[' + repr('CONDA_PREFIX') + '], path)) for path in ' + repr(('Lib', 'Library/bin')) + ' if os.path.isdir(os.path.join(os.environ[' + repr('CONDA_PREFIX') + '], path))]\n'; p.write_text(dll_line + os.path.join(prefix, 'lib', 'python') + '\n')"''', depends-on = ["configure"] }

usdview = { cmd = "usdview --complexity high --renderer Embree" }
usdrecord = { cmd = "usdrecord --complexity high --renderer Embree" }
usdrender = { cmd = "usdrender --complexity high --renderer Embree" }
